[project]
name = "incidentiq-api"
version = "0.1.0"
description = "IncidentIQ backend API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic-settings>=2.5",
    "uvicorn[standard]>=0.30",
    # Offline ingestion of the external datasets. Kept in the main dependency set so a
    # plain `uv sync` is enough to reproduce a download — no hidden setup step.
    "huggingface-hub>=0.26",
    "pyarrow>=18",
    "openai>=3.5.0",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]
pairwise = [
    "joblib>=1.4",
    "scikit-learn>=1.5",
]
# Semantic correlation only. Kept out of the default install because it pulls
# onnxruntime and downloads a model on first use; the deterministic baseline and the
# whole test suite run without it. Install with: uv sync --group semantic
semantic = [
    "fastembed>=0.8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "pg: needs a running PostgreSQL with pgvector (docker compose up -d)",
]
